[project]
name = "backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.0",
  "Flask-Cors>=6.0.0",
  "Flask-SQLAlchemy>=3.1.0",
  "SQLAlchemy>=2.0.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "pytest>=8.3.0",
  "gunicorn"
]

[tool.vercel]
entrypoint = "run:app"
